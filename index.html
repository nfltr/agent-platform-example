<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent platform</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; color: #1f2328; }
  h1 { font-size: 1.3rem; }
  form, .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input, textarea, button { font: inherit; padding: .35rem .5rem; }
  textarea { flex: 1 1 100%; min-height: 4rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #d0d7de; vertical-align: top; }
  tr.task { cursor: pointer; }
  tr.task:hover { background: #f6f8fa; }
  pre { white-space: pre-wrap; background: #f6f8fa; padding: .75rem; margin: 0; max-height: 24rem; overflow: auto; }
  .completed { color: #1a7f37; } .failed, .cancelled { color: #cf222e; } .pending, .running, .storing { color: #9a6700; }
  #err { color: #cf222e; }
</style>
</head>
<body>
<h1>Agent platform</h1>
<div class="bar">
  <input id="token" type="password" placeholder="API token" autocomplete="off">
  <button id="save">Use token</button>
  <label>Show <select id="scope"><option value="team">team</option><option value="mine">mine</option></select></label>
  <span id="err" role="alert"></span>
</div>
<form id="new">
  <textarea id="prompt" placeholder="What should the agent do?" required></textarea>
  <input id="machine" placeholder="machine (optional)">
  <input id="repo" placeholder="repository (optional)">
  <button>Run task</button>
</form>
<p id="costs"></p>
<table>
  <thead><tr><th>Task</th><th>Status</th><th>Machine</th><th>By</th><th>Cost</th><th>Prompt</th></tr></thead>
  <tbody id="tasks"></tbody>
</table>
<script>
// Agent output is untrusted: it is only ever set as textContent, never as HTML.
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("token") || "";
let open = decodeURIComponent(location.hash.slice(1)) || null; // a task link (#<task id>) opens that task

async function api(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"},
    body: body && JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

function cell(tr, text, cls) {
  const td = tr.insertCell();
  td.textContent = text == null ? "" : text;
  if (cls) td.className = cls;
}

async function refresh() {
  if (!token) return;
  try {
    const tasks = await api("/tasks?scope=" + $("scope").value);
    const c = await api("/costs");
    $("costs").textContent = "Cost by developer: " + (c.developers.map((d) =>
      d.developer + " $" + d.cost_usd.toFixed(4) + " (" + d.tasks + " tasks)").join(" · ") || "none yet");
    const body = $("tasks");
    body.replaceChildren();
    for (const t of tasks) {
      const tr = body.insertRow();
      tr.className = "task";
      cell(tr, t.id); cell(tr, t.status, t.status); cell(tr, t.machine); cell(tr, t.submitted_by);
      cell(tr, "$" + t.cost_usd.toFixed(4) + " · " + t.tokens + " tok"); cell(tr, t.prompt.slice(0, 80));
      tr.onclick = () => { open = open === t.id ? null : t.id; refresh(); };
      if (open === t.id) {
        const detail = body.insertRow().insertCell();
        detail.colSpan = 6;
        const pre = document.createElement("pre");
        pre.textContent = [t.text || "(no answer yet)", t.error && "error: " + t.error,
          t.branch && "branch: " + t.branch + " " + (t.sha || "")].filter(Boolean).join("\n\n");
        detail.append(pre);
      }
    }
    $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
}

$("token").value = token;
$("scope").onchange = refresh;
$("save").onclick = () => { token = $("token").value.trim(); sessionStorage.setItem("token", token); refresh(); };
$("new").onsubmit = async (ev) => {
  ev.preventDefault();
  const body = {prompt: $("prompt").value};
  if ($("machine").value) body.machine = $("machine").value.trim();
  if ($("repo").value) body.repo = $("repo").value.trim();
  try { await api("/tasks", body); $("prompt").value = ""; refresh(); } catch (e) { $("err").textContent = e.message; }
};
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
